name: Suggest an improvement
description: Something that would make the kit more useful.
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste private keys, mnemonics, `.env` contents, RPC URLs that contain an
        API key, or code you can't share publicly.
  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea (optional)
      description: How you think it could work.
  - type: input
    id: client
    attributes:
      label: Client and version
      description: e.g. Codex CLI, Cursor 2.x, Claude Code 2.1.x.
  - type: dropdown
    id: drafted_by
    attributes:
      label: Who wrote this report?
      options:
        - I wrote it
        - An AI agent drafted it at my request, and I reviewed it before posting
    validations:
      required: true
