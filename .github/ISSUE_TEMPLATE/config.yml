# Blank issues stay on so a report drafted outside the forms (for example by a coding agent,
# then read and posted by the user) can still be filed.
blank_issues_enabled: true
contact_links:
  - name: Security problem
    url: https://github.com/vschernoff/solidity-ai-kit/security/advisories/new
    about: Report privately, not in a public issue.
  - name: Question or idea to discuss
    url: https://github.com/vschernoff/solidity-ai-kit/discussions
    about: Questions about setup or use.
