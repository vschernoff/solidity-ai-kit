name: Eval

# Evaluation harness (SRS §8.2, eval/README.md). Linux only by decision D16; the kit's own
# tests stay cross-platform in TESTS.yml.
on:
  push:
    branches: [main]
    paths: ['eval/**', 'kit.manifest.json', '.github/workflows/EVAL.yml']
  pull_request:
    paths: ['eval/**', 'kit.manifest.json', '.github/workflows/EVAL.yml']
  workflow_dispatch:

permissions:
  contents: read

# D25: a newer push to the same PR cancels the older run. Other runs are keyed by commit: a
# group holds one pending run and a newer one replaces it whatever cancel-in-progress says, so a
# ref-wide key would drop queued runs of earlier commits on main.
concurrency:
  group: eval-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    name: Fixtures and ground truth
    # Pinned, not ubuntu-latest: the label moves to Ubuntu 26 from 2026-10-19 and the eval must
    # not change underneath a comparison (bump deliberately, with a re-run of the ground truth).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fixture and comparison tests (no toolchain needed)
        run: node --test 'eval/test/*.test.js'
      # Version and action commit must match eval/deps.json (eval/test/workflow.test.js).
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
          cache: false
      - name: Fetch forge-std at the pinned commit (sha256-checked)
        run: node eval/scripts/fetch-deps.mjs
      - name: Confirm ground truth with forge
        run: node eval/scripts/confirm-ground-truth.mjs --out ground-truth-report.json
      - name: Keep the report as evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ground-truth-report
          path: ground-truth-report.json
          if-no-files-found: warn

  probe:
    # One pinned candidate per job: install on the runner (network, integrity-checked, no
    # lifecycle scripts), then probe in a container with no network, a read-only root and a
    # read-only install, as a non-root user. The report is the evidence, kept as an artifact.
    name: Probe ${{ matrix.candidate }}${{ matrix.forge && format(' (forge {0})', matrix.forge) || '' }}
    # Pinned, not ubuntu-latest: the label moves to Ubuntu 26 from 2026-10-19 and the eval must
    # not change underneath a comparison (bump deliberately, with a re-run of the ground truth).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # A candidate that runs forge gets one job per forge version in eval/deps.json
        # foundry.caseVersions (eval/test/workflow.test.js).
        include:
          - candidate: solhint-mcp
          - candidate: forge-test-mcp
            forge: v1.8.5
          - candidate: forge-test-mcp
            forge: v1.8.6
    env:
      CANDIDATE: ${{ matrix.candidate }}
      FORGE_VERSION: ${{ matrix.forge }}
      # Must match eval/deps.json probeImage (eval/test/workflow.test.js).
      PROBE_IMAGE: node:24.19.0-bookworm-slim@sha256:a9f5f7c91a432850b2a8a7797adf5eadb6c733ceed61167806cee7ea7fbc29df
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the pinned candidate
        run: node eval/scripts/install-candidate.mjs "$CANDIDATE" "$RUNNER_TEMP/candidate"
      # Toolchain for candidates that run forge, fetched on the runner (network) and mounted
      # read-only into the no-network container: forge, solc for FOUNDRY_SOLC, forge-std.
      - if: matrix.forge
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ matrix.forge }}
          cache: false
      - name: Fetch solc and forge-std (sha256-checked)
        if: matrix.forge
        run: |
          node eval/scripts/fetch-solc.mjs "$RUNNER_TEMP/toolchain"
          node eval/scripts/fetch-deps.mjs
          # foundryup installs ~/.foundry/bin/forge as a symlink into ~/.foundry/versions/; mount
          # the real binary's directory, or the link dangles inside the container.
          forge_bin=$(readlink -f "$(command -v forge)")
          # The binary must be the one pinned in eval/deps.json for this version.
          expected=$(node -p "require('./eval/deps.json').foundry.forgeLinuxAmd64Sha256[process.env.FORGE_VERSION]")
          actual=$(sha256sum "$forge_bin" | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "forge $FORGE_VERSION sha256 $actual, expected $expected" >&2
            exit 1
          fi
          echo "FORGE_DIR=$(dirname "$forge_bin")" >> "$GITHUB_ENV"
          "$forge_bin" --version
      - name: Probe with no network
        run: |
          mkdir -p "$RUNNER_TEMP/out" && chmod 777 "$RUNNER_TEMP/out"
          TOOLCHAIN=()
          if [ -n "$FORGE_VERSION" ]; then
            TOOLCHAIN=(-v "$FORGE_DIR:/foundry:ro" -v "$RUNNER_TEMP/toolchain:/toolchain:ro"
              -e PATH=/foundry:/usr/local/bin:/usr/bin:/bin -e SAK_SOLC=/toolchain/solc)
          fi
          # --init: a real PID 1 that reaps orphaned children, so close() never mistakes a
          # zombie for a surviving process.
          docker run --rm --init --network none --read-only --tmpfs /tmp --user 1001:1001 \
            "${TOOLCHAIN[@]}" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/candidate:/candidate:ro" \
            -v "$RUNNER_TEMP/out:/out" \
            "$PROBE_IMAGE" \
            node /repo/eval/scripts/probe.mjs "$CANDIDATE" /candidate --out /out/probe.json
          cp "$RUNNER_TEMP/candidate/install-report.json" "$RUNNER_TEMP/out/"
      - name: Run the stage cases with no network
        run: |
          TOOLCHAIN=()
          if [ -n "$FORGE_VERSION" ]; then
            TOOLCHAIN=(-v "$FORGE_DIR:/foundry:ro" -v "$RUNNER_TEMP/toolchain:/toolchain:ro"
              -e PATH=/foundry:/usr/local/bin:/usr/bin:/bin -e SAK_SOLC=/toolchain/solc)
          fi
          # Same container and flags as the probe; each case gets its own server process.
          docker run --rm --init --network none --read-only --tmpfs /tmp --user 1001:1001 \
            "${TOOLCHAIN[@]}" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/candidate:/candidate:ro" \
            -v "$RUNNER_TEMP/out:/out" \
            "$PROBE_IMAGE" \
            node /repo/eval/scripts/run-cases.mjs "$CANDIDATE" /candidate --out /out/cases.json
      - name: Findings in the step summary
        if: always()
        run: |
          node eval/scripts/probe-summary.mjs "$RUNNER_TEMP/out/probe.json" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/out/cases.json" ]; then
            node eval/scripts/cases-summary.mjs "$RUNNER_TEMP/out/cases.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the probe report as evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.candidate }}${{ matrix.forge && format('-forge-{0}', matrix.forge) || '' }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
