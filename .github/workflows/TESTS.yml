# Actions minutes are limited, and macOS counts 10×, Windows 2×.
# - Pull requests: lint and Linux (D25).
# - Push to main: lint, Linux and Windows (D30).
# - Nightly and on demand: everything, macOS included (D30).
# A Windows or macOS failure found after merge is fixed forward with priority.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every other run gets a group of its
# own (one per commit), because GitHub cancels a *pending* run in the same group whenever a
# newer one queues, whatever cancel-in-progress says; a ref-wide group could drop a merged
# commit's run. queue: max would avoid that too, but GitHub rejects it alongside
# cancel-in-progress: true, which pull requests need.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: ubuntu-latest / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    name: windows-latest / Node ${{ matrix.node }}
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  macos:
    name: macos-latest / Node ${{ matrix.node }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  # NFR-2: the packed tarball, installed into a fresh project; init and doctor run from it,
  # and doctor starts every manifest component through the real npx. Linux on pull
  # requests, Linux and Windows on main, all three nightly and on demand (D25, D30).
  packed:
    name: packed / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || (github.event_name == 'push' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:packed
