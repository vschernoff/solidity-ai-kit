# D25: GitHub Actions minutes are limited (macOS counts 10×, Windows 2×). Pull requests
# run lint and Linux only; the full matrix runs on main, nightly and on demand. A macOS or
# Windows failure found after merge is fixed forward with priority.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every other run gets a group of its
# own (one per commit), because GitHub cancels a *pending* run in the same group whenever a
# newer one queues, whatever cancel-in-progress says; a ref-wide group could drop a merged
# commit's run. queue: max would avoid that too, but GitHub rejects it alongside
# cancel-in-progress: true, which pull requests need.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: ubuntu-latest / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  other-platforms:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  # NFR-2: the packed tarball, installed into a fresh project; init and doctor run from it,
  # and doctor starts every manifest component through the real npx. Linux on pull
  # requests (D25); all three platforms on main, nightly and on demand.
  packed:
    name: packed / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:packed
